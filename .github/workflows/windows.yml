name: Build and release Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TOOLS_PYTHON: python
      PYTHONPATH: collector
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: collector/requirements*.txt
      - run: npm ci
      - run: python -m pip install -r collector/requirements-build.txt
      - run: npm test
      - run: python -m unittest discover -s collector/tests -v
      - run: npm run test:suite
      - run: npm run build:win
      - name: Install and launch the actual Windows installer
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem artifacts/Tools-Workbench-*-Windows-x64-Setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $target = Join-Path $env:RUNNER_TEMP 'tools-installed'
          $result = Start-Process -FilePath $installer[0].FullName -ArgumentList "/S /D=$target" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          $exe = Join-Path $target 'tools-workbench.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable was not found.' }
          npm run test:suite -- "$exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify release files and record SHA-256
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem artifacts/Tools-Workbench-*-Windows-x64-Setup.exe)
          $blockmap = "$($installer[0].FullName).blockmap"
          if (!(Test-Path artifacts/latest.yml) -or !(Test-Path $blockmap)) { throw 'Updater files missing.' }
          $hash = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content artifacts/SHA256SUMS.txt "$hash  $($installer[0].Name)" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          if-no-files-found: error
          path: |
            artifacts/Tools-Workbench-*-Windows-x64-Setup.exe
            artifacts/Tools-Workbench-*-Windows-x64-Setup.exe.blockmap
            artifacts/latest.yml
            artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-screenshots
          path: test-output/suite/

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: release
      - name: Publish matching version and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'Release %s already exists.\n' "$TAG"
          else
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "工具工作台 $TAG" \
              --notes-file "docs/releases/$TAG.md"
          fi
